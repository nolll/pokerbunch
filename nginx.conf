server {
  listen $PORT;
  server_name www.pokerbunch.com www.pokerbun.ch pokerbun.ch;
  port_in_redirect off;
  return 301 https://pokerbunch.com$request_uri;
}

server {
  listen $PORT;
  server_name pokerbunch.com;
  port_in_redirect off;
  
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1100;
  gzip_buffers 16 8k;
  gzip_proxied any;
  gzip_types text/plain text/html text/css application/javascript application/json;
  
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$server_name$request_uri;
  }

  location / {
    # At least three of these are for oh-vue-icons
    set $STYLEHASH1 "'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='";
    set $STYLEHASH2 "'sha256-BW8NYdPk+rv9lpNlgLUX1TA/NiHG2tpA6q6KRC//k5c='";
    set $STYLEHASH3 "'sha256-dsGP181IqXG75B+r9iF1SiIhPNVTsVx0BJXDFaoQLq4='";
    set $STYLEHASH4 "'sha256-Qkou26UJ4mma/LNSpT1/69nlpyu27XJKOUO7n13g5Yk='";

    set $DEFAULT "default-src 'none'";
    set $SCRIPT "script-src 'self' https://plausible.io";
    set $IMG "img-src 'self' gravatar.com";
    set $CONNECT "connect-src 'self' https://plausible.io";
    set $STYLE "style-src 'self' fonts.googleapis.com ${STYLEHASH1} ${STYLEHASH2} ${STYLEHASH3} ${STYLEHASH4}";
    set $FONT "font-src 'self' fonts.gstatic.com";
    set $FRAMEANCESTORS "frame-ancestors 'none'";
    set $BASEURI "base-uri 'none'";
    set $FORMACTION "form-action 'none'";

    add_header content-security-policy "${DEFAULT}; ${SCRIPT}; ${IMG}; ${CONNECT}; ${STYLE}; ${FONT}; ${FRAMEANCESTORS}; ${BASEURI}; ${FORMACTION}";
    add_header strict-transport-security "max-age=63072000; includeSubDomains";
    add_header x-content-type-options "nosniff";
    add_header x-frame-options "DENY";
    add_header referrer-policy "no-referrer";
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_ssl_server_name on;
    proxy_pass https://api.pokerbunch.com/;
  }
}
